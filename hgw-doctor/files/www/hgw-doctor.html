<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HGW-Doctor</title>
<style>
  :root{
    --bg:#0E1318;
    --panel:#161D24;
    --panel-2:#1B232B;
    --line:#2A343D;
    --text:#E8ECEF;
    --text-dim:#8B96A1;
    --amber:#F2A93B;
    --teal:#4FD1C5;
    --red:#C0272D;
    --red-glow: rgba(192,39,45,0.35);
    --teal-glow: rgba(79,209,197,0.35);
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Consolas, monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{min-height:100vh;}

  /* ── Header ── */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #11161B, #0E1318);
    position:sticky;top:0;z-index:10;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:0.5px;
    color:var(--text);
  }
  .brand .mark span{color:var(--amber);}
  .conn-pill{
    display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;
    padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:var(--text-dim);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);flex-shrink:0;}
  .dot.live{background:var(--teal);box-shadow:0 0 6px var(--teal-glow);animation:beat 1.8s ease-in-out infinite;}
  .dot.down{background:var(--red);box-shadow:0 0 6px var(--red-glow);}
  @keyframes beat{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.5);opacity:0.6;}}

  .topbar-right{display:flex;align-items:center;gap:10px;}
  .btn{
    font-family:var(--sans);font-size:12.5px;font-weight:600;
    padding:7px 13px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .btn:hover{border-color:#3A4754;background:#202B34;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn.primary{background:var(--amber);color:#1A1300;border-color:var(--amber);}
  .btn.primary:hover{background:#FFC25C;}
  .btn.danger{background:transparent;color:var(--red);border-color:var(--red);}
  .btn.danger:hover{background:var(--red);color:white;}
  .btn.ghost{background:transparent;}

  /* ── Login ── */
  .login-wrap{
    min-height:90vh;display:flex;align-items:center;justify-content:center;
  }
  .login-card{
    width:340px;padding:28px 26px;border:1px solid var(--line);
    border-radius:12px;background:var(--panel);
  }
  .login-card h1{font-family:var(--mono);font-size:18px;margin:0 0 4px;}
  .login-card h1 span{color:var(--amber);}
  .login-card .sub{color:var(--text-dim);font-size:12.5px;margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
  .field input{
    width:100%;padding:9px 10px;border-radius:6px;border:1px solid var(--line);
    background:#0E1318;color:var(--text);font-family:var(--mono);font-size:13px;
  }
  .field input:focus{outline:none;border-color:var(--amber);}
  .login-err{color:var(--red);font-size:12px;margin-top:10px;min-height:14px;}
  .login-card .btn{width:100%;margin-top:6px;padding:10px;text-align:center;}
  .demo-link{display:block;text-align:center;margin-top:16px;color:var(--text-dim);font-size:12px;cursor:pointer;text-decoration:underline;}

  /* ── Layout ── */
  .wrap{max-width:1180px;margin:0 auto;padding:22px;}
  .demo-banner{
    background:rgba(242,169,59,0.1);border:1px solid var(--amber);color:var(--amber);
    padding:8px 14px;border-radius:8px;font-size:12.5px;margin-bottom:16px;
    display:flex;justify-content:space-between;align-items:center;
  }

  /* ── Vitals strip ── */
  .vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .vital-card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  }
  .vital-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
  .vital-card .value{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1;}
  .vital-card .value .unit{font-size:13px;color:var(--text-dim);margin-left:3px;}
  .bar-track{height:4px;border-radius:2px;background:#1F2830;margin-top:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:2px;background:var(--teal);transition:width .4s;}
  .bar-fill.warn{background:var(--amber);}
  .bar-fill.crit{background:var(--red);}

  /* ── Section ── */
  .section{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden;}
  .section-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 16px;border-bottom:1px solid var(--line);
  }
  .section-head h2{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--text-dim);}
  .section-body{padding:0;}

  /* ── Process table ── */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;padding:9px 14px;color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:.3px;font-weight:600;border-bottom:1px solid var(--line);}
  td{padding:11px 14px;border-bottom:1px solid #1D2731;font-family:var(--mono);font-size:13px;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#1A222A;}
  .svc-name{font-family:var(--sans);font-weight:600;font-size:13px;}
  .status-cell{display:flex;align-items:center;gap:7px;}
  .badge{
    display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;
    font-family:var(--mono);letter-spacing:.3px;
  }
  .badge.ok{background:rgba(79,209,197,0.15);color:var(--teal);}
  .badge.dead{background:rgba(192,39,45,0.15);color:var(--red);}
  .badge.warn{background:rgba(242,169,59,0.15);color:var(--amber);}
  .badge.idle{background:rgba(139,150,161,0.15);color:var(--text-dim);}
  .esc-pip{display:inline-flex;gap:3px;}
  .esc-pip .pip{width:7px;height:7px;border-radius:50%;background:#2A343D;}
  .esc-pip .pip.on1{background:var(--amber);}
  .esc-pip .pip.on2{background:var(--red);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .icon-btn{
    border:1px solid var(--line);background:transparent;color:var(--text-dim);
    border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer;font-family:var(--sans);
  }
  .icon-btn:hover{border-color:var(--amber);color:var(--amber);}
  .thread-flag{font-size:10.5px;padding:1px 5px;border-radius:4px;margin-left:5px;}
  .thread-flag.z{background:rgba(192,39,45,0.15);color:var(--red);}
  .thread-flag.d{background:rgba(242,169,59,0.15);color:var(--amber);}

  /* ── Actions panel ── */
  .actions-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:16px;}
  .action-card{
    border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--panel-2);
    display:flex;flex-direction:column;gap:10px;
  }
  .action-card h3{margin:0;font-size:13px;font-weight:700;}
  .action-card p{margin:0;font-size:11.5px;color:var(--text-dim);line-height:1.4;}
  select{
    width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--line);
    background:#0E1318;color:var(--text);font-family:var(--mono);font-size:12px;
  }
  .action-msg{font-size:11.5px;min-height:14px;margin-top:2px;}
  .action-msg.success{color:var(--teal);}
  .action-msg.error{color:var(--red);}

  /* ── Anomaly log ── */
  .log-row{display:grid;grid-template-columns:120px 1fr 110px 90px 130px;gap:10px;padding:10px 16px;border-bottom:1px solid #1D2731;font-size:12.5px;align-items:center;}
  .log-row:last-child{border-bottom:none;}
  .log-row.head{color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:.3px;font-weight:600;border-bottom:1px solid var(--line);}
  .log-type{font-family:var(--mono);font-weight:600;}
  .log-empty{padding:30px;text-align:center;color:var(--text-dim);font-size:12.5px;}

  /* ── Config ── */
  .config-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;}
  .cfg-item{padding:13px 16px;border-bottom:1px solid #1D2731;border-right:1px solid #1D2731;}
  .cfg-item .k{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px;}
  .cfg-item .v{font-family:var(--mono);font-size:14px;font-weight:600;}

  .footer-note{text-align:center;color:var(--text-dim);font-size:11.5px;margin-top:6px;padding-bottom:20px;}

  @media(max-width:760px){
    .vitals{grid-template-columns:repeat(2,1fr);}
    .actions-grid{grid-template-columns:1fr;}
    .config-grid{grid-template-columns:1fr;}
    .log-row{grid-template-columns:1fr;gap:3px;}
  }
</style>
</head>
<body>

<div id="root"></div>

<script>
(function(){

  /* ── State ── */
  const state = {
    host: localStorage.getItem('hgwd_host') || (location.hostname || '192.168.1.1'),
    token: null,
    connected: false,
    demo: false,
    data: null,
    error: null,
    lastUpdate: null,
    autoRefresh: true,
    refreshTimer: null,
    actionMsg: {clear:'', restart:'', reboot:''},
    restartTarget: '',
  };

  const root = document.getElementById('root');

  /* ── Demo data generator ── */
  function demoSnapshot(){
    const services = ['cwmp_plugin','tr181-device','dhcpv4-manager','tr181-dns','test-service'];
    return {
      Status:'Enabled', Enable:true,
      Stats:{CurrentCPUUsage: 8 + Math.round(Math.random()*6), CurrentMemUsage: 31 + Math.round(Math.random()*4), UptimeSeconds: 312840},
      SelfStats:{CurrentRSSKB: 7360 + Math.round(Math.random()*40), CurrentCPUUsage: 0},
      ProcessList: services.join(','),
      MonitoredProcess: services.map((n,i)=>({
        Name:n, Status: n==='test-service'&&Math.random()>0.85 ? 'Dead':'Running',
        CurrentCPU: Math.round(Math.random()*15), CurrentMem: Math.round(2+Math.random()*8),
        ThreadCount: n==='test-service'? (Math.random()>0.7?2:1) : 1+Math.round(Math.random()*2),
        ZombieThreadCount:0, BlockedThreadCount:0, MinThreadCount: n==='test-service'?1:1,
        EscalationLevel:0, RestartCount: i===4?2:0,
      })),
      AnomalyLog:[
        {AnomalyType:'ProcessMem', RecoveryStatus:'Resolved', Timestamp:'14:52:09', AnomalyDurationSeconds:30, ActionTaken:'ProcessRestart'},
        {AnomalyType:'Process', RecoveryStatus:'Resolved', Timestamp:'14:38:51', AnomalyDurationSeconds:5, ActionTaken:'ProcessRestart'},
        {AnomalyType:'ThreadLow', RecoveryStatus:'Pending', Timestamp:'14:31:02', AnomalyDurationSeconds:0, ActionTaken:'None'},
      ],
      CPUThreshold:90, MemThreshold:90, ThresholdDuration:60, PollInterval:5,
      EscalationEnabled:true, EscalationResetMinutes:10, RebootCount:1,
    };
  }

  /* ── API calls ── */
  async function login(host, user, pass){
    const res = await fetch(`http://${host}/session`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:user, password:pass})
    });
    if(!res.ok) throw new Error(`Login failed (HTTP ${res.status})`);
    const j = await res.json();
    if(!j.sessionID) throw new Error('No session token returned');
    return j.sessionID;
  }

  async function fetchData(){
    const res = await fetch(`http://${state.host}/serviceElements/Device.X_TELNET_HGWDoctor.`, {
      headers:{'Authorization':`Bearer ${state.token}`}
    });
    if(res.status===401) throw new Error('SESSION_EXPIRED');
    if(res.status===403) throw new Error('Access denied (ACL) for this role');
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const j = await res.json();
    return parseFlatResponse(j);
  }

  /* amx-fcgi returns a FLAT array: one entry per object in the subtree,
     each shaped {path, parameters}. Multi-instance tables (MonitoredProcess,
     AnomalyLog, Profiles) appear as separate entries like
     "Device.X_TELNET_HGWDoctor.MonitoredProcess.1." -- we reassemble them
     into arrays here so the rest of the UI can treat them normally. */
  function parseFlatResponse(arr){
    const root = {};
    const tables = {MonitoredProcess:[], AnomalyLog:[], Profiles:[]};
    const rootPathRe = /^Device\.X_TELNET_HGWDoctor\.$/;
    const tableRowRe = /^Device\.X_TELNET_HGWDoctor\.(MonitoredProcess|AnomalyLog|Profiles)\.(\d+)\.$/;
    const subObjRe = /^Device\.X_TELNET_HGWDoctor\.(Stats|SelfStats)\.$/;

    for(const entry of arr){
      const path = entry.path || '';
      const params = entry.parameters || {};
      if(rootPathRe.test(path)){
        Object.assign(root, params);
      } else if(subObjRe.test(path)){
        const m = path.match(subObjRe);
        root[m[1]] = params;
      } else if(tableRowRe.test(path)){
        const m = path.match(tableRowRe);
        tables[m[1]].push({__idx:parseInt(m[2],10), ...params});
      }
    }
    tables.MonitoredProcess.sort((a,b)=>a.__idx-b.__idx);
    tables.AnomalyLog.sort((a,b)=>b.__idx-a.__idx); /* most recent first */
    tables.Profiles.sort((a,b)=>a.__idx-b.__idx);

    root.MonitoredProcess = tables.MonitoredProcess;
    root.AnomalyLog = tables.AnomalyLog;
    root.Profiles = tables.Profiles;
    return root;
  }

  async function patchParam(obj){
    const res = await fetch(`http://${state.host}/serviceElements/Device.X_TELNET_HGWDoctor.`, {
      method:'PATCH',
      headers:{'Authorization':`Bearer ${state.token}`, 'Content-Type':'application/json'},
      body: JSON.stringify(obj)
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return true;
  }

  /* ── Polling ── */
  async function poll(){
    if(state.demo){
      state.data = demoSnapshot();
      state.connected = true;
      state.lastUpdate = new Date();
      render();
      return;
    }
    try{
      const d = await fetchData();
      state.data = d;
      state.connected = true;
      state.error = null;
      state.lastUpdate = new Date();
    }catch(e){
      state.connected = false;
      state.error = e.message;
    }
    render();
  }

  function startPolling(){
    if(state.refreshTimer) clearInterval(state.refreshTimer);
    poll();
    state.refreshTimer = setInterval(()=>{ if(state.autoRefresh) poll(); }, 5000);
  }

  /* ── Helpers ── */
  function fmtUptime(s){
    if(s==null) return '--';
    const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60);
    return d>0 ? `${d}d ${h}h` : `${h}h ${m}m`;
  }
  function barClass(v){ return v>=90?'crit':v>=70?'warn':''; }
  function statusBadge(st){
    if(st==='Running') return `<span class="badge ok">RUNNING</span>`;
    if(st==='Dead') return `<span class="badge dead">DEAD</span>`;
    return `<span class="badge idle">${(st||'UNKNOWN').toUpperCase()}</span>`;
  }
  function escPips(level){
    level = level||0;
    return `<span class="esc-pip">
      <span class="pip ${level>=1?'on1':''}"></span>
      <span class="pip ${level>=2?'on2':''}"></span>
    </span>`;
  }
  function recBadge(s){
    if(s==='Resolved') return `<span class="badge ok">RESOLVED</span>`;
    if(s==='Unresolved') return `<span class="badge dead">UNRESOLVED</span>`;
    return `<span class="badge warn">PENDING</span>`;
  }

  /* ── Action handlers ── */
  window.__doAction = async function(kind, target){
    state.actionMsg[kind] = '...';
    render();
    try{
      if(kind==='clear'){
        await patchParam({ActionType:'CacheClear'});
        state.actionMsg.clear = {ok:true,text:'Cache cleared'};
      } else if(kind==='restart'){
        await patchParam({ActionType:'ProcessRestart', OnDemandTarget: target||''});
        state.actionMsg.restart = {ok:true,text: target? `Restarted ${target}` : 'Restarted all services'};
      } else if(kind==='reboot'){
        if(!confirm('Reboot the gateway now? This will disconnect all clients for ~30 seconds.')) { render(); return; }
        await patchParam({ActionType:'Reboot'});
        state.actionMsg.reboot = {ok:true,text:'Reboot triggered \u2014 gateway restarting'};
      }
    }catch(e){
      state.actionMsg[kind] = {ok:false,text:e.message};
    }
    render();
    setTimeout(()=>{ poll(); }, 1500);
  };

  window.__setTarget = function(v){ state.restartTarget = v; };

  window.__login = async function(ev){
    ev.preventDefault();
    const host = document.getElementById('f-host').value.trim() || '192.168.1.1';
    const user = document.getElementById('f-user').value.trim();
    const pass = document.getElementById('f-pass').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    try{
      const token = await login(host, user, pass);
      state.host = host; state.token = token; state.demo = false;
      localStorage.setItem('hgwd_host', host);
      startPolling();
    }catch(e){
      errEl.textContent = e.message;
    }
  };

  window.__demo = function(){
    state.demo = true; state.connected = true; state.token = 'demo';
    startPolling();
  };

  window.__logout = function(){
    if(state.refreshTimer) clearInterval(state.refreshTimer);
    state.token = null; state.demo = false; state.data = null; state.connected = false;
    render();
  };

  window.__toggleAuto = function(){
    state.autoRefresh = !state.autoRefresh;
    render();
  };

  window.__refreshNow = function(){ poll(); };

  /* ── Render ── */
  function render(){
    if(!state.token){
      root.innerHTML = loginView();
      return;
    }
    const d = state.data;
    root.innerHTML = `
      ${topbar()}
      <div class="wrap">
        ${state.demo ? `<div class="demo-banner"><span>Demo mode \u2014 showing simulated data, not connected to a real gateway.</span><span class="btn ghost" onclick="__logout()" style="padding:4px 10px;">Exit</span></div>` : ''}
        ${!state.connected && !state.demo ? `<div class="demo-banner" style="border-color:var(--red);color:var(--red);background:rgba(192,39,45,0.08);">Connection lost: ${state.error||'unknown error'}</div>` : ''}
        ${d ? vitalsView(d) : ''}
        ${d ? processTable(d) : ''}
        ${d ? actionsPanel(d) : ''}
        ${d ? anomalyLog(d) : ''}
        ${d ? configView(d) : ''}
        <div class="footer-note">HGW-Doctor \u00b7 ${state.demo? 'demo session' : state.host} \u00b7 last update ${state.lastUpdate? state.lastUpdate.toLocaleTimeString() : '--'}</div>
      </div>
    `;
  }

  function topbar(){
    const live = state.connected;
    return `
      <div class="topbar">
        <div class="brand">
          <span class="mark">HGW<span>-</span>DOCTOR</span>
          <span class="conn-pill"><span class="dot ${live?'live':'down'}"></span>${live? 'Connected' : 'Offline'}</span>
        </div>
        <div class="topbar-right">
          <button class="btn ghost" onclick="__toggleAuto()">${state.autoRefresh?'Auto-refresh: on':'Auto-refresh: off'}</button>
          <button class="btn" onclick="__refreshNow()">Refresh now</button>
          <button class="btn danger" onclick="__logout()">Log out</button>
        </div>
      </div>
    `;
  }

  function loginView(){
    return `
      <div class="login-wrap">
        <div class="login-card">
          <h1>HGW<span>-</span>Doctor</h1>
          <div class="sub">Sign in to monitor this gateway</div>
          <form onsubmit="__login(event)">
            <div class="field">
              <label>Gateway address</label>
              <input id="f-host" type="text" value="${state.host}" placeholder="192.168.1.1">
            </div>
            <div class="field">
              <label>Username</label>
              <input id="f-user" type="text" value="admin" autocomplete="username">
            </div>
            <div class="field">
              <label>Password</label>
              <input id="f-pass" type="password" autocomplete="current-password">
            </div>
            <div class="login-err" id="login-error"></div>
            <button class="btn primary" type="submit">Connect</button>
          </form>
          <span class="demo-link" onclick="__demo()">View with demo data instead</span>
        </div>
      </div>
    `;
  }

  function vitalsView(d){
    const cpu = d.Stats?.CurrentCPUUsage ?? 0;
    const mem = d.Stats?.CurrentMemUsage ?? 0;
    const rss = d.SelfStats?.CurrentRSSKB ?? 0;
    const up = d.Stats?.UptimeSeconds ?? null;
    return `
      <div class="vitals">
        <div class="vital-card">
          <div class="label">System CPU</div>
          <div class="value">${cpu}<span class="unit">%</span></div>
          <div class="bar-track"><div class="bar-fill ${barClass(cpu)}" style="width:${cpu}%"></div></div>
        </div>
        <div class="vital-card">
          <div class="label">System Memory</div>
          <div class="value">${mem}<span class="unit">%</span></div>
          <div class="bar-track"><div class="bar-fill ${barClass(mem)}" style="width:${mem}%"></div></div>
        </div>
        <div class="vital-card">
          <div class="label">Daemon RSS</div>
          <div class="value">${(rss/1024).toFixed(1)}<span class="unit">MB</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(rss/10240)*100)}%"></div></div>
        </div>
        <div class="vital-card">
          <div class="label">Gateway Uptime</div>
          <div class="value" style="font-size:20px;">${fmtUptime(up)}</div>
          <div class="bar-track" style="opacity:0;"></div>
        </div>
      </div>
    `;
  }

  function processTable(d){
    const procs = d.MonitoredProcess || [];
    const rows = procs.map(p=>{
      const flags = `${p.ZombieThreadCount>0?`<span class="thread-flag z">Z\u00d7${p.ZombieThreadCount}</span>`:''}${p.BlockedThreadCount>0?`<span class="thread-flag d">D\u00d7${p.BlockedThreadCount}</span>`:''}`;
      return `
        <tr>
          <td class="svc-name">${p.Name}</td>
          <td class="status-cell">${statusBadge(p.Status)}</td>
          <td>${p.CurrentCPU ?? 0}%</td>
          <td>${p.CurrentMem ?? 0}%</td>
          <td>${p.ThreadCount ?? '-'}${flags}</td>
          <td>${escPips(p.EscalationLevel)}</td>
          <td>${p.RestartCount ?? 0}</td>
          <td><div class="row-actions"><button class="icon-btn" onclick="__doAction('restart','${p.Name}')">Restart</button></div></td>
        </tr>
      `;
    }).join('');
    return `
      <div class="section">
        <div class="section-head"><h2>Monitored Services</h2></div>
        <div class="section-body">
          <table>
            <thead><tr>
              <th>Service</th><th>Status</th><th>CPU</th><th>Mem</th><th>Threads</th><th>Escalation</th><th>Restarts</th><th></th>
            </tr></thead>
            <tbody>${rows || `<tr><td colspan="8" class="log-empty">No services in ProcessList</td></tr>`}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  function actionMsgHtml(kind){
    const m = state.actionMsg[kind];
    if(!m) return '';
    if(m==='...') return `<div class="action-msg">Working\u2026</div>`;
    return `<div class="action-msg ${m.ok?'success':'error'}">${m.text}</div>`;
  }

  function actionsPanel(d){
    const procs = (d.MonitoredProcess||[]).map(p=>p.Name);
    return `
      <div class="section">
        <div class="section-head"><h2>On-Demand Actions</h2></div>
        <div class="actions-grid">
          <div class="action-card">
            <h3>Clear cache</h3>
            <p>Drops the kernel page cache, dentries and inodes. Safe, non-disruptive.</p>
            <button class="btn" onclick="__doAction('clear')">Clear cache</button>
            ${actionMsgHtml('clear')}
          </div>
          <div class="action-card">
            <h3>Restart a service</h3>
            <p>Restarts one monitored service, or all of them if none selected.</p>
            <select onchange="__setTarget(this.value)">
              <option value="">All services</option>
              ${procs.map(n=>`<option value="${n}">${n}</option>`).join('')}
            </select>
            <button class="btn" onclick="__doAction('restart', __getTarget())">Restart</button>
            ${actionMsgHtml('restart')}
          </div>
          <div class="action-card">
            <h3>Reboot gateway</h3>
            <p>Full system reboot. Disconnects all customer devices for ~30 seconds.</p>
            <button class="btn danger" onclick="__doAction('reboot')">Reboot now</button>
            ${actionMsgHtml('reboot')}
          </div>
        </div>
      </div>
    `;
  }
  window.__getTarget = function(){ return state.restartTarget; };

  function anomalyLog(d){
    const log = d.AnomalyLog || [];
    const rows = log.map(a=>`
      <div class="log-row">
        <span class="log-type">${a.AnomalyType}</span>
        <span>${a.ActionTaken||'\u2014'}</span>
        <span>${recBadge(a.RecoveryStatus)}</span>
        <span>${a.AnomalyDurationSeconds??0}s</span>
        <span style="color:var(--text-dim);">${a.Timestamp||''}</span>
      </div>
    `).join('');
    return `
      <div class="section">
        <div class="section-head"><h2>Anomaly Log</h2></div>
        <div class="section-body">
          <div class="log-row head">
            <span>Type</span><span>Action</span><span>Recovery</span><span>Duration</span><span>Time</span>
          </div>
          ${rows || `<div class="log-empty">No anomalies recorded</div>`}
        </div>
      </div>
    `;
  }

  function configView(d){
    const items = [
      ['CPU threshold', `${d.CPUThreshold ?? '-'}%`],
      ['Memory threshold', `${d.MemThreshold ?? '-'}%`],
      ['Threshold duration', `${d.ThresholdDuration ?? '-'}s`],
      ['Poll interval', `${d.PollInterval ?? '-'}s`],
      ['Escalation', d.EscalationEnabled ? 'Enabled' : 'Disabled'],
      ['Escalation reset', `${d.EscalationResetMinutes ?? '-'} min`],
      ['Reboot count', `${d.RebootCount ?? 0}`],
      ['Process list', (d.ProcessList||'').split(',').length + ' services'],
      ['Status', d.Status || '-'],
    ];
    return `
      <div class="section">
        <div class="section-head"><h2>Configuration</h2></div>
        <div class="config-grid">
          ${items.map(([k,v])=>`<div class="cfg-item"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}
        </div>
      </div>
    `;
  }

  render();
})();
</script>
</body>
</html>
